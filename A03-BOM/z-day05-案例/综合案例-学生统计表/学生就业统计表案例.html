<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>学生就业统计表</title>
  <link rel="stylesheet" href="./iconfont/iconfont.css">
  <link rel="stylesheet" href="css/index.css" />
</head>

<body>
  <h1>学生就业统计表</h1>
  <form class="info" autocomplete="off">
    <input type="text" class="uname" name="uname" placeholder="姓名" />
    <input type="text" class="age" name="age" placeholder="年龄" />
    <input type="text" class="salary" name="salary" placeholder="薪资" />
    <select name="gender" class="gender">
      <option value="男">男</option>
      <option value="女">女</option>
    </select>
    <select name="city" class="city">
      <option value="北京">北京</option>
      <option value="上海">上海</option>
      <option value="广州">广州</option>
      <option value="深圳">深圳</option>
      <option value="曹县">曹县</option>
    </select>
    <button class="add">
      <i class="iconfont icon-tianjia"></i>添加
    </button>
  </form>

  <div class="title">共有数据<span>0</span>条</div>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>姓名</th>
        <th>年龄</th>
        <th>性别</th>
        <th>薪资</th>
        <th>就业城市</th>
        <th>录入时间</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody>
      <!-- <tr>
        <td>1</td>
        <td>迪丽热巴</td>
        <td>23</td>
        <td>女</td>
        <td>12000</td>
        <td>北京</td>
        <td>2099/9/9 08:08:08</td>
        <td>
          <a href="javascript:">
            <i class="iconfont icon-shanchu"></i>
            删除
          </a>
        </td>
      </tr> -->
    </tbody>
  </table>
  <script>
    // 参考数据
    const initData = [
      {
        stuId: 1,
        uname: '迪丽热巴',
        age: 22,
        salary: '12000',
        gender: '女',
        city: '北京',
        time: '2099/9/9 08:08:08'
      }
    ]

    // 1. 渲染模块
    // 1.1 将数据存储到本地存储中 只是测试的时候使用
    // localStorage.setItem('data', JSON.stringify(initData))
    // 1.2 从本地存储中获取数据，如果没有数据，就返回空数组，此处用逻辑中断实现
    const arr = JSON.parse(localStorage.getItem('data')) || []
    // 1.3 渲染函数
    const tbody = document.querySelector('tbody')
    const sum = document.querySelector('.title span')
    function render() {
      // 1.3.1 通过map()方法将数组中的每个元素转换为tr标签，并返回一个新数组
      const trArr = arr.map(function (ele, index) {
        return `
        <tr>
          <td>${ele.stuId}</td>
          <td>${ele.uname}</td>
          <td>${ele.age}</td>
          <td>${ele.gender}</td>
          <td>${ele.salary}</td>
          <td>${ele.city}</td>
          <td>${ele.time}</td>
          <td>
            <a href="javascript:" data-index="${index}">
              <i class="iconfont icon-shanchu"></i>
              删除
            </a>
          </td>
        </tr>
      `
      })

      // 1.3.2 通过join()方法，将trArr数组转换为字符串
      const str = trArr.join('')

      // 1.3.3 将str字符串添加到tbody标签中
      tbody.innerHTML = str

      // 1.3.4 更新标题中的span标签内容
      sum.innerHTML = arr.length
    }

    render()

    // 2. 新增模块
    const form = document.querySelector('.info')
    const uname = document.querySelector('.uname')
    const age = document.querySelector('.age')
    const salary = document.querySelector('.salary')
    const gender = document.querySelector('.gender')
    const city = document.querySelector('.city')
    // 2.1 给form表单注册提交事件，并阻止其默认提交行为
    form.addEventListener('submit', function (e) {
      e.preventDefault()
      // 2.1.1 非空判断
      if (!uname.value || !age.value || !salary.value) {
        return alert('输入不能为空')
      }
      // 2.1.2 声明一个对象，用于存储用户输入的数据
      const obj = {
        stuId: arr.length ? arr[arr.length - 1].stuId + 1 : 1,
        uname: uname.value,
        age: age.value,
        salary: salary.value,
        gender: gender.value,
        city: city.value,
        time: new Date().toLocaleString()
      }
      // 2.1.3 将obj对象添加到数组中
      arr.push(obj)
      // 2.1.4 渲染函数
      render()
      // 2.1.5 清空表单
      form.reset()
      // 2.1.6 本地存储
      localStorage.setItem('data', JSON.stringify(arr))
    })


    // 3. 删除模块
    // 3.1 给tbody注册点击事件，通过事件委托实现删除功能
    tbody.addEventListener('click', function (e) {
      // 3.1.1 找到删除按钮a标签
      if (e.target.tagName === 'A') {
        // 3.1.2 根据自定义属性，找到数组中对应删除的下标
        const index = e.target.dataset.index

        // 确认用户是否要删除
        if (confirm('您确认要删除这条数据吗？')) {
          // 3.1.3 根据下标删除数组中对应的元素
          arr.splice(index, 1)
          // 3.1.4 渲染函数
          render()
          // 3.1.5 更新本地存储
          localStorage.setItem('data', JSON.stringify(arr))
        }
      }
    })
  </script>
</body>

</html>
