<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    /*
      量词：用于指定字符出现的次数
      * >=0个
      + >=1个
      ? 匹配零或一个
      {n} 匹配n次
      {n,} 匹配n次到多次 逗号左右两侧千万不要出现空格
      {n,m} 匹配n次到m次 逗号左右两侧千万不要出现空格
    */
    console.log(/^哈$/.test(''))      // false
    console.log(/^哈$/.test('哈'))    // true 
    console.log(/^哈$/.test('哈哈'))  // false
    console.log(/^哈$/.test('二哈'))  // false
    console.log('-----------------')

    console.log(/^哈*$/.test(''))      // true
    console.log(/^哈*$/.test('哈'))    // true 
    console.log(/^哈*$/.test('哈哈'))  // true
    console.log(/^哈*$/.test('二哈'))  // false
    console.log('-----------------')

    console.log(/^哈+$/.test(''))      // false
    console.log(/^哈+$/.test('哈'))    // true 
    console.log(/^哈+$/.test('哈哈'))  // true
    console.log(/^哈+$/.test('二哈'))  // false
    console.log('-----------------')

    console.log(/^哈?$/.test(''))      // true
    console.log(/^哈?$/.test('哈'))    // true 
    console.log(/^哈?$/.test('哈哈'))  // false
    console.log(/^哈?$/.test('二哈'))  // false
    console.log('-----------------')

    console.log(/^哈{3}$/.test(''))         // false
    console.log(/^哈{3}$/.test('哈'))       // false
    console.log(/^哈{3}$/.test('哈哈'))     // false
    console.log(/^哈{3}$/.test('哈哈哈'))   // true
    console.log(/^哈{3}$/.test('哈哈哈哈'))  // false
    console.log(/^哈{3}$/.test('二哈'))     // false
    console.log('-----------------')

    console.log(/^哈{3,}$/.test(''))         // false
    console.log(/^哈{3,}$/.test('哈'))       // false
    console.log(/^哈{3,}$/.test('哈哈'))     // false
    console.log(/^哈{3,}$/.test('哈哈哈'))   // true
    console.log(/^哈{3,}$/.test('哈哈哈哈'))  // true
    console.log(/^哈{3,}$/.test('二哈'))     // false
    console.log('-----------------')

    console.log(/^哈{3,4}$/.test(''))         // false
    console.log(/^哈{3,4}$/.test('哈'))       // false
    console.log(/^哈{3,4}$/.test('哈哈'))     // false
    console.log(/^哈{3,4}$/.test('哈哈哈'))   // true
    console.log(/^哈{3,4}$/.test('哈哈哈哈'))  // true
    console.log(/^哈{3,4}$/.test('哈哈哈哈哈'))  // false
    console.log(/^哈{3,4}$/.test('二哈'))     // false
    console.log('-----------------')
  </script>
</body>

</html>
