<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    /*
    延时函数：在指定的时间后执行指定的代码。只执行一次
    语法：setTimeout(函数名，时间)
    清除延时函数：clearTimeout(延时函数的返回值)
    */
    const timer = setTimeout(function () {
      alert('hello world')
    }, 3000)
    // 清除延时函数
    clearTimeout(timer)
  </script>
</body>

</html>
