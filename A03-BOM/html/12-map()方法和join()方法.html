<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    /*
    1. 数组的 map()方法 用于将数组中的每个元素都调用一次函数，返回一个新的数组
    即 映射关系
    语法：
    newArr = arr.map(function(ele, index) {
      return 新的元素
    })
    */
    const arr = ['red', 'green', 'blue']
    const newArr = arr.map(function (ele, index) {
      // console.log(ele) // ele 是element的缩写 数组中的每个元素
      // console.log(index) // index 是数组中的索引
      return ele + '颜色'
    })
    console.log(newArr)

    // 2. 数组的 join()方法 用于将数组中的元素转换为字符串，元素用指定的分隔符连接起来
    // 语法：str = arr.join(分隔符) 分隔符是什么就用什么分割

    // 小括号没有填，默认用逗号分割
    const str1 = newArr.join()  // red颜色,green颜色,blue颜色
    console.log(str1)
    // 小括号中是空字符串，则没有分割，直接连接起来
    const str2 = newArr.join('')  // red颜色green颜色blue颜色
    console.log(str2)
  </script>
</body>

</html>
