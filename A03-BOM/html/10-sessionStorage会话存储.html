<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    /*
    sessionStorage对象 和 localStorage对象 的区别：
    - sessionStorage对象 关闭浏览器，存储就会被删除
    - localStorage对象 关闭浏览器，存储不会被删除
    - 会话存储和本地存储的区别：
    - 会话存储：当前会话期间可以访问到，关闭浏览器后会话存储会被删除
    - 本地存储：关闭浏览器后本地存储不会被删除

    二者的用法基本相同
    */
  </script>
</body>

</html>
