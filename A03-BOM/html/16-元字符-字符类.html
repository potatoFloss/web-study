<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    /*
      字符类 ：[] 
      重点：只匹配一个字符，如果需要匹配多个字符，需要使用量词
      [abc] 匹配a、b、c中的任意一个
      [^abc] 匹配除了a、b、c中的任意一个
      [a-z] 匹配a到z中的任意一个
      [0-9] 匹配0到9中的任意一个
      [a-zA-Z] 匹配a到z或A到Z中的任意一个
      [.] 排除换行符的任意一个字符

      预定义：某些常见模式的简写方式
      \d 匹配0到9中的任意一个，等价于[0-9]
      \D 匹配除了0到9中的任意一个，等价于[^0-9]
      \w 匹配字母、数字、下划线中的任意一个，等价于[a-zA-Z0-9_]
      \W 匹配除了字母、数字、下划线中的任意一个，等价于[^a-zA-Z0-9_]
      \s 匹配空格(包括空格符、制表符、换行符)中的任意一个，等价于[ \t\r\n\v\f]
      \S 匹配除了空格(包括空格符、制表符、换行符)中的任意一个，等价于[^ \t\r\n\v\f]
    */
  </script>
</body>

</html>
