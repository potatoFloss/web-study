<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <ul>
    <li>1</li>
    <li>2</li>
    <li>3</li>
  </ul>
  <script>
    /*
    1.静态方法：
    Array.from()：将类数组对象转换为数组
    
    2.展开运算符（ES6 最常用）
    const realArr = [...arr1]
    */

    const arr1 = document.querySelectorAll('ul li')
    console.log(arr1)  // [li, li, li]
    // arr1.pop()  // 报错，因为arr1是伪数组，没有pop()方法

    const arr2 = Array.from(arr1)
    console.log(arr2)  // [li, li, li]
    arr2.pop()
    console.log(arr2)  // [li, li] arr2是真数组，有pop()方法
  </script>
</body>

</html>
