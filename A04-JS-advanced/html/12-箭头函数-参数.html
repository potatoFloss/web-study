<!DOCTYPE html>

<body>
  <script>
    /*
    箭头函数中没有arguments动态参数，但是有剩余参数语法
    */
    // 用箭头函数写一个求和函数
    const getSum = (...arr) => {
      let sum = 0
      for (let i = 0; i < arr.length; i++) {
        sum += arr[i]
      }
      return sum
    }
    const result = getSum(1, 2, 3)
    console.log(result)
  </script>
</body>
