<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    /*
    原型继承：通过原型对象实现继承
    */
    /*
    例子：
    1. 创建一个女人的构造函数
    2. 创建一个男人的构造函数
    3. 发现，女人和男人都有一些共同的属性，例如：1个脑袋、2个眼睛等
    
    4. 所以可以把这些公共的属性抽取出来，封装到person对象上
      - 这是有bug的，解决方法是，创建Person构造函数，继承时通过new Person()创建的一个新对象
    
    5. 然后在女人的构造函数和男人的构造函数中，分别用prototype获得person对象的属性
      - 记得，这个方法相当于重写prototype，所以一定要记得添加原来的constructor属性
    */

    // const Person = {
    //   head: 1,
    //   eye: 2,
    //   say: function () {
    //     console.log('会说话')
    //   }
    // }

    function Person() {
      this.head = 1
      this.eye = 2
      this.say = function () {
        console.log('会说话')
      }
    }

    function Woman() {
      // this.head = 1
      // this.eye = 2
      // this.say = function () {
      //   console.log('会说话')
      // }
    }

    function Man() {
      // this.head = 1
      // this.eye = 2
      // this.say = function () {
      //   console.log('会说话')
      // }
    }

    Woman.prototype = new Person()
    Woman.prototype.constructor = Woman
    // 女人能做但是男人不能做的事情
    Woman.prototype.baby = function () {
      console.log('会生孩子')
    }
    /*
    这里就会发现一个问题，只给女人添加baby方法，但是男人也会有baby方法，这是不合理的
    因为，
    Woman.prototype = Person
    Man.prototype = Person
    女人和男人的prototype都指向了Person对象，即它俩的地址是一样的，
    所以修改女人的prototype（Woman.prototype.baby = function ()），也会修改男人的prototype
    
    解决方法：
    通过构造函数的方法，创建一个Person构造函数
    女人和男人在继承时，用 new Person() 来创建的一个新对象，
    这样就可以避免上面的问题了
    */
    console.log(Woman.prototype)

    Man.prototype = new Person()
    Man.prototype.constructor = Man
    console.log(Man.prototype)
  </script>
</body>

</html>
