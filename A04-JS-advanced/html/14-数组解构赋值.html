<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    /*
      数组解构赋值
      可以将数组中的元素，分别赋值给多个变量
      语法：
        const [变量1, 变量2, 变量3, ...] = 数组
      例如：
        const [a, b, c] = [1, 2, 3]
        console.log(a, b, c)  // 1 2 3
    */
    // 1. 数组解构赋值
    const arr = [1, 2, 3]
    const [a, b, c] = arr
    console.log(a, b, c)  // 1 2 3
    // const [a, b, c] = [1, 2, 3]
    // console.log(a, b, c)  // 1 2 3

    // 应用场景：交换两个变量的值
    let x = 10
    let y = 20;  // 一定记得加分号
    [x, y] = [y, x]
    console.log(x, y)  // 20 10
  </script>
</body>

</html>
