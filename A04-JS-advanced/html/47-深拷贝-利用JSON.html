<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    const obj = {
      name: '佩奇',
      age: 18,
      family: {
        father: '猪爸爸',
        mother: '猪妈妈',
        sister: '朵娅'
      }
    }

    // 通过JSON.stringify()和JSON.parse()实现深拷贝
    const objCopy = JSON.parse(JSON.stringify(obj))

    objCopy.family.father = 'Copy'
    console.log(objCopy)
    console.log(obj)
  </script>
</body>

</html>
