<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    /*
    改变普通函数中this指向的三种方法：
    1. call(thisArg, ...args)
      - 改变this指向为thisArg
      - 执行函数，返回函数执行结果
    
      2. apply(thisArg[, argsArray])
      - 改变this指向为thisArg
      - argsArray为数组，数组中的元素为函数的参数值
      - 执行函数，返回函数执行结果
      - 应用场景：由于和数组有关，所以可以使用如Math.max()求数组最大值
    
      3. bind(thisArg, ...args)
        - 改变this指向为thisArg
        - 不同于call()和apply()，bind()不会立即执行函数
        - 返回一个新的函数，当新函数被调用时，this指向为thisArg
    */

    const obj = {
      name: '张三'
    }

    // 1. call()
    function fn1(x, y) {
      console.log(this)  // window
      console.log(x + y)
    }
    fn1.call(obj, 1, 2)  // obj
    console.log('-----------------')

    // 2. apply(thisArg[, argsArray])
    function fn2(x, y) {
      console.log(this)  // window
      console.log(x + y)
    }
    fn2.apply(obj, [1, 2])  // obj
    // 2.1 应用场景：求数组最大值和最小值
    const arr = [1, 2, 3, 4, 5]
    console.log(Math.max.apply(null, arr))  // 5
    console.log(Math.min.apply(Math, arr))  // 1
    console.log('-----------------')
  </script>
</body>

</html>
