<body>
  <script>
    /*
    垃圾回收机制：当一个变量不再被使用时，会自动被回收。
    局部变量在函数执行结束后，会被自动回收。
    全局变量在页面关闭后，会被自动回收。
    内存泄露：当一个变量不再被使用时，但是由于某种原因没有被回收，就会导致内存泄露。

    堆栈空间分配区别：
    - 栈（操作系统）：由操作系统自动分配释放函数的参数值、局部变量等，基本数据类型存放在栈里面
    - 堆（操作系统）：一般由开发人员手动分配释放，若开发人员不释放，则由垃圾回收机制回收。复杂数据类型存放在堆里面

    2种常见的浏览器垃圾回收算法：引用计数算法 和 标记清除算法。
    - 引用计数算法（现在基本不太用）：每个变量都有一个引用计数器，当变量被赋值给其他变量时，计计数器增加；当变量被释放时，计数器减少；当计数器为0时，变量被回收。
    - 标记清除算法：将所有变量标记为"可回收"，当变量被引用时，将其标记为"不可回收"，最后将所有标记为"可回收"的变量回收。
          从根部扫描对象，能查找到的就是使用的，不能查找到的就要被回收。

    */
  </script>
</body>

</html>
