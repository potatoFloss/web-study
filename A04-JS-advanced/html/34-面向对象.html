    两种编程思想：面向过程和面向对象
    蛋炒饭 盖浇饭
    面向过程：将程序看作是一个过程，每个过程都有一个任务要完成
    面向对象：按照功能模块进行划分，将程序看作是一个对象，每个对象都有一个任务要完成

    面向对象的特点：继承、多态、封装
