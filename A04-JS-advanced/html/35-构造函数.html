<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    /*
    面向对象编程的特性：如封装性、继承性等，可以借助构造函数来实现。
    但是，构造函数存在浪费内存的问题。

    */
    function Star(uname, age) {
      this.uname = uname
      this.age = age
      this.sing = function () {
        console.log('会唱歌')
      }
    }

    const ldh = new Star('刘德华', 50)
    const zxy = new Star('张学友', 50)

    console.log(ldh.sing === zxy.sing)  // false 但是直观给人的感受是，这俩方法一样，为什么要重新开辟内存空间？浪费内存
  </script>
</body>

</html>
