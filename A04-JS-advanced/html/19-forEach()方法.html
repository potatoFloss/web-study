<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    /*
    forEach()方法：调用数组的每个元素，并将元素传递给回调函数
    注意： forEach()方法不会返回新的数组
          map()方法会返回新的数组
    forEach(item, index) 其中，item必填，index可选
    应用场景：适合于遍历数组对象
    */

    const arr = ['red', 'green', 'blue']
    arr.forEach(function (item) {
      console.log(item)
    })
  </script>
</body>

</html>
