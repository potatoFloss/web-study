<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>面向对象封装消息提示</title>
  <link rel="stylesheet" href="./css/综合案例.css">
</head>

<body>
  <button id="delete">删除</button>
  <button id="login">登录</button>

  <!-- <div class="modal">
    <div class="header">温馨提示 <i>x</i></div>
    <div class="body">您没有删除权限操作</div>
  </div> -->


  <script>
    // 1. Modal 构造函数封装-模态框
    function Modal(title, message) {
      // 1.1 创建modal模态框盒子
      this.modalBox = document.createElement('div')
      // 1.2 给div标签添加类名modal
      this.modalBox.className = 'modal'
      // 1.3 modal盒子内部填充两个div标签，其中的文字内容可修改
      this.modalBox.innerHTML = `
        <div class="header">${title} <i>x</i></div>
        <div class="body">${message}</div>
      `
      console.log(this.modalBox)
    }
    // new Modal('提示', '确认删除吗？')
    // new Modal('提示', '您还没有注册账号')

    // 2. open 方法：打开模态框
    Modal.prototype.open = function () {
      // 先判断页面中是否有模态框盒子，若有，则先移除，再添加新的盒子
      const box = document.querySelector('.modal')
      box && box.remove()

      document.body.append(this.modalBox)

      // 等盒子显示出来，就添加点击事件
      /*
      这里使用箭头函数的原因是：
      1. 箭头函数没有自己的this，指向外部（上一级）的this，
      2. 在这里，是Modal.prototype.open方法的this，即指向Modal实例

      为什么不使用普通函数？
      1. 因为普通函数中的this指向的是调用该方法的对象实例，即this.modalBox.querySelector('i')
      */
      this.modalBox.querySelector('i').addEventListener('click', () => {
        this.close()
      })
    }

    // 3. close 方法：关闭模态框
    Modal.prototype.close = function () {
      this.modalBox.remove()
    }

    // 测试
    document.querySelector('#delete').addEventListener('click', function () {
      const del = new Modal('提示', '确认删除吗？')
      del.open()
    })

    document.querySelector('#login').addEventListener('click', function () {
      const login = new Modal('提示', '您还没有注册账号')
      login.open()
    })
  </script>
</body>

</html>
