<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <!-- 挂载点 容器 -->
  <div id="app">
    <h1>{{ message }}</h1>
  </div>

  <!-- 引入vue.js包 开发版本/生产版本 -->
  <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>

  <script>
    // 创建vue实例
    // el: 挂载点
    // data: 数据
    const app = new Vue({
      el: '#app',  // 通过选择器指定是哪个元素
      data: {
        message: 'hello vue'
      }
    })
  </script>
</body>

</html>
