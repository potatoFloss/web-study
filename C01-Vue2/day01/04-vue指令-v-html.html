<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <!--
    vue指令: 指令是vue.js提供的,用于操作dom的特殊属性(区别于普通属性,如class,style等)
    语法: v-指令名="表达式"
    
    v-html: 将表达式渲染为html标签(近似于innerHTML)
    语法: v-html="表达式"
  -->
  <div id="app">
    <div v-html="message"></div>
  </div>

  <!-- 引入vue.js包 开发版本/生产版本 -->
  <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>

  <script>
    // 创建vue实例
    // el: 挂载点
    // data: 数据
    const app = new Vue({
      el: '#app',  // 通过选择器指定是哪个元素
      data: {
        message: `<h1>hello vue</h1>`
      }
    })
  </script>
</body>

</html>
