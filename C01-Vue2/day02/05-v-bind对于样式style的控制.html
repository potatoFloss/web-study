<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box {
      width: 200px;
      height: 200px;
      background-color: rgb(187, 150, 156);
    }
  </style>
</head>

<body>
  <div id="app">
    <!-- 
      v-bind对于样式style的控制
      语法：:style="{属性名: 值, 属性名: 值}"
      注意：
        1. 由于后面跟的是一个JS对象，所以要按照JS对象的格式写，即，属性名中间不能有 -
          例如：background-color -> 小驼峰 backgroundColor 或者 用引号括起来 "background-color"
        2. 值记得加引号
     -->
    <div class="box" :style="{width: '300px', height: '300px', backgroundColor: 'skyblue'}"></div>
  </div>
  <script src="./vue.js"></script>
  <script>
    const app = new Vue({
      el: '#app',
      data: {

      }
    })
  </script>
</body>

</html>
