<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box {
      width: 200px;
      height: 200px;
      border: 3px solid #000;
      font-size: 30px;
      margin-top: 10px;
    }

    .pink {
      background-color: pink;
    }

    .big {
      width: 300px;
      height: 300px;
    }
  </style>
</head>

<body>
  <!-- 
    v-bind对于样式class的控制 
    语法：
      :class="对象/数组"
        1.对象，如果值为true，有这个类，否则没有这个类 -> :class="{类名1: 布尔值, 类名2: 布尔值}"
        2.数组，数组中所有的类，都会添加，本质为一个class列表 -> :class="[类名1,类名2,类名3]"
  -->
  <div id="app">
    <div class="box" :class="{pink: true, big: false}">黑马程序员</div>
    <div class="box" :class="['pink', 'big']">黑马程序员</div>
  </div>
  <script src="./vue.js"></script>
  <script>
    const app = new Vue({
      el: '#app',
      data: {

      }
    })
  </script>
</body>

</html>
