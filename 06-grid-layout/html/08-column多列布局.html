<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>column多列布局</title>
  <style>
    /* column多列布局
    多列布局与flex布局和grid布局的区别是：在实现瀑布流效果时（假设有3列），
    flex布局和grid布局需要先创建3个列，再往每列里填元素，
    而column布局则可以省去创建列的步骤。
    */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .box {
      /* 多列布局（多栏布局）：块级元素直接设置 column-count 即可生效，不需要 display: column（该值无效） */
      column-count: 4;
      /* 多列布局默认有 column-gap: 1em 的列间距*/
      column-gap: 20px;
      /* 列之间的分割线 */
      column-rule: 1px solid red;
      max-width: 1200px;
      border: 1px solid red;
      margin: 20px auto;
    }

    .box .item {
      height: 100px;
      background-color: pink;
      margin-bottom: 20px;
      /* 不允许盒子被切割 */
      break-inside: avoid-column;
    }

    .box .item:nth-child(2n) {
      height: 200px;
    }

    .box .item:nth-child(3) {
      height: 300px;
    }
  </style>
</head>

<body>
  <div class="box">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
    <div class="item">5</div>
    <div class="item">6</div>
    <div class="item">7</div>
    <div class="item">8</div>
    <div class="item">9</div>
    <div class="item">10</div>
    <div class="item">11</div>
    <div class="item">12</div>
    <div class="item">13</div>
    <div class="item">14</div>
    <div class="item">15</div>
    <div class="item">16</div>
    <div class="item">17</div>
  </div>
</body>

</html>
