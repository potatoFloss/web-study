<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>id选择器</title>
  <!-- id选择器：跟类选择器差不多，但是只能选择一个元素（只能用一次） -->
  <!-- 通常配合JavaScript实现交互效果，所以如果修改样式，一般建议用类选择器 -->
  <!-- id选择器的名字是唯一的，不能重复 -->
  <style>
    #color {
      color: pink;
    }
  </style>
</head>

<body>
  <ul>
    <li id="color">喜羊羊</li>
    <li>美羊羊</li>
    <li>懒羊羊</li>
    <li>灰太狼</li>
  </ul>
</body>

</html>
