<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>类型选择器</title>
  <style>
    p {
      color: pink;
    }

    li {
      color: blue;
    }

    /* 就近原则（层叠性）：最近的样式会覆盖前面的样式 */
    p {
      color: blueviolet;
    }
  </style>
</head>

<body>
  <!-- 类型选择器（元素选择器、标签选择器）：根据标签的类型来选择标签 -->
  <p>这是一个粉色的段落</p>

  <ul>
    <li>这是一个蓝色的段落</li>
  </ul>
</body>

</html>
