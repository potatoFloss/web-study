<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>链接状态伪类</title>

  <style>
    /* 伪类选择器：选择元素的特定状态或结构位置，符号是: */
    /* 分类：状态伪类、结构伪类、表单伪类 */

    /* 状态伪类选择器：链接伪类，严格按照lvha顺序写 */
    /* lvha：link 为访问链接的默认样式、visited 已访问链接的样式、hover 鼠标悬停在链接上的样式、active 点击链接时的样式 */
    /* a:link {
      color: black;
      text-decoration: none;
    }

    a:visited {
      color: green;
      text-decoration: none;
    }

    a:hover {
      color: blue;
      text-decoration: underline;
    }

    a:active {
      color: yellow;
      text-decoration: none;
    } */

    /* 一般网站开发时的书写 */
    a {
      color: black;
      text-decoration: none;
    }

    a:hover {
      color: blue;
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <a href="https://www.baidu.com">百度一下</a>
</body>

</html>
