<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>通配符选择器</title>

  <!-- 通配符选择器：选择页面所有元素 -->
  <style>
    * {
      color: pink;
      /* 常用情况（如下所示）：通过通配符选择器清除所有元素的默认边距和填充，统一不同浏览器的默认样式 */
      margin: 0;
      /* 清除默认外边距 */
      padding: 0;
      /* 清除默认内边距 */
      box-sizing: border-box;
      /* 使用边框盒模型，使宽度和高度包含内边距和边框 */
    }
  </style>
</head>

<body>
  <p>这是一个段落</p>
  <div>这是一个div</div>
  <strong>这是一个加粗的段落</strong>
</body>

</html>
