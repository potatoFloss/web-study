<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>font简写</title>
  <!-- 语法 font: font-style font-weight font-size/line-height font-family; -->
  <!-- 其中 font-size和font-family是必填项，且应该严格按照顺序填写 -->
  <style>
    div {
      font: italic bold 20px/1.5 "宋体";
      /* 高度不被继承 */
      height: 100px;
    }

    /* CSS的继承性 */
    /* 主要继承跟文字相关的属性，如字体、颜色、文本对齐等 */
    /* 优先自己的样式 */
    p {
      font-size: 40px;
    }
  </style>
</head>

<body>
  <div>
    <p>这是一个段落</p>
  </div>
</body>

</html>
