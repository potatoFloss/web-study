<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>内联和内部样式表</title>
  <!-- 内部样式表 -->
  <style>
    p {
      color: blue;
    }
  </style>
</head>

<body>
  <!-- 内联样式表（行内样式表）：直接写在标签内部，控制当前标签的样式 -->
  <p style="color: red;">这是一个红色的段落</p>

  <!-- 内部样式表：在head标签中的style标签中定义的样式，控制当前页面的所有标签的样式 -->
  <p>这是一个蓝色的段落</p>
</body>

</html>
