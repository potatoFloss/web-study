<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <!-- 引入bootstrap.css -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css">
  <!-- 公共 -->
  <style>
    html,
    body {
      background-color: #EDF0F5;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 520px;
      height: 540px;
      background-color: #fff;
      padding: 60px;
      box-sizing: border-box;
    }

    .container h3 {
      font-weight: 900;
    }
  </style>
  <!-- 表单容器和内容 -->
  <style>
    .form_wrap {
      color: #8B929D !important;
    }

    .form-text {
      color: #8B929D !important;
    }
  </style>
  <!-- 提示框样式 -->
  <style>
    .alert {
      transition: .5s;
      opacity: 0;
    }

    .alert.show {
      opacity: 1;
    }
  </style>
</head>

<body>
  <div class="container">
    <h3>欢迎-登录</h3>
    <!-- 登录结果-提示框 -->
    <div class="alert alert-success" role="alert">
      提示消息
    </div>
    <!-- 表单 -->
    <div class="form_wrap">
      <form>
        <div class="mb-3">
          <label for="username" class="form-label">账号名</label>
          <input type="text" class="form-control username">
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">密码</label>
          <input type="password" class="form-control password">
        </div>
        <button type="button" class="btn btn-primary btn-login"> 登 录 </button>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <script>
    // 4. 封装登录提示信息函数
    const tip = document.querySelector('.alert')
    function loginTip(msg, flag) {
      tip.classList.add('show')
      tip.innerHTML = msg
      const bgStyle = flag ? 'alert-success' : 'alert-danger'
      tip.classList.add(bgStyle)

      setTimeout(() => {
        tip.classList.remove('show')
        tip.classList.remove(bgStyle)
      }, 2000)
    }

    // 1. 获取登录按钮，并注册点击事件
    document.querySelector('.btn-login').addEventListener('click', function () {
      // 2. 获取用户输入的用户名和密码
      const username = document.querySelector('.username').value
      const password = document.querySelector('.password').value
      // 3. 判断输入是否合法
      // 3.1 用户名 最少8位 由中英文和数字组成
      if (!/^[a-zA-Z0-9]{8,}$/.test(username)) {
        console.log('用户名 最少8位 由中英文和数字组成')
        loginTip('用户名最少8位由中英文和数字组成', false)
        return
      }
      // 3.2 密码 最少6位 由数字组成
      if (!/^[0-9]{6,}$/.test(password)) {
        loginTip('密码最少6位由数字组成', false)
        console.log('密码 最少6位 由数字组成')
        return
      }
      // 4. 通过axios向服务器发送登录请求
      axios({
        url: 'https://hmajax.itheima.net/api/login',
        method: 'POST',
        data: {
          username,
          password
        }
      }).then(result => {
        loginTip('登录成功', true)
        console.log(result.data)
      }).catch(error => {
        // console.dir(error)
        // 获得某属性的路径的小技巧：鼠标右键单击属性名，选择“复制属性路径”
        console.log(error.response.data.message)
        loginTip(error.response.data.message, false)
      })
    })


  </script>
</body>

</html>
