<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>认识Promise状态</title>
</head>

<body>
  <script>
    /**
     * 目标：认识Promise状态
     * 三种状态：pending（待定状态）、fulfilled（已兑现）、rejected（已拒绝）
    */
    // 1. 创建Promise对象
    const p = new Promise((resolve, reject) => {
      // promise对象创建时，会立即执行这里的代码
      console.log('立刻被执行')

      // 2. 执行异步代码
      setTimeout(() => {
        // 调用resolve() => fulfilled状态 => then()
        // resolve('模拟AJAX请求-成功结果')
        // 调用reject() => rejected状态 => catch()
        reject(new Error('模拟AJAX请求-失败结果'))
      }, 2000)
    })
    console.log(p)

    // 3. 获取结果
    p.then(result => {
      console.log(result)
    }).catch(error => {
      console.log(error)
    })


  </script>
</body>

</html>
