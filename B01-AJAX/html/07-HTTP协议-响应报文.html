<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <button class="btn">注册用户</button>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    /*
      响应报文：浏览器根据规定格式接收服务器返回的内容集合
        1. 响应行（第一行，包含协议、HTTP响应状态码、状态信息）
        2. 响应头
        3. 空行
        4. 响应体（服务器返回的数据）

      响应码：
        1xx：信息响应
        2xx：请求成功
        3xx：重定向消息
        4xx：客户端错误
        5xx：服务端错误

      响应报文在控制台的查看方式：
        控制台 -> 网络 -> Fetch/XHR -> 选则对应的请求并点击 ->
        响应头：标头 -> 响应标头（勾选“原始”）查看源代码
        响应体：响应
    */
    document.querySelector('.btn').addEventListener('click', () => {
      axios({
        url: 'https://hmajax.itheima.net/api/register',
        method: 'POST',
        data: {
          username: 'liudehua23',
          password: '123456'
        }
      }).then(result => {
        console.log(result)
        // 提交失败 控制台查看response.data.message
      }).catch(error => {
        console.dir(error)
        console.log(error.response.data.message)
        // 提示用户失败信息
        alert(error.response.data.message)
      })
    })
  </script>
</body>

</html>
