<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>轮播图点击切换</title>
  <style>
    * {
      box-sizing: border-box;
    }

    .slider {
      width: 560px;
      height: 400px;
      overflow: hidden;
    }

    .slider-wrapper {
      width: 100%;
      height: 320px;
    }

    .slider-wrapper img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .slider-footer {
      height: 80px;
      background-color: rgb(100, 67, 68);
      padding: 12px 12px 0 12px;
      position: relative;
    }

    .slider-footer .toggle {
      position: absolute;
      right: 0;
      top: 12px;
      display: flex;
    }

    .slider-footer .toggle button {
      margin-right: 12px;
      width: 28px;
      height: 28px;
      appearance: none;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
    }

    .slider-footer .toggle button:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .slider-footer p {
      margin: 0;
      color: #fff;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .slider-indicator {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      align-items: center;
    }

    .slider-indicator li {
      width: 8px;
      height: 8px;
      margin: 4px;
      border-radius: 50%;
      background: #fff;
      opacity: 0.4;
      cursor: pointer;
    }

    .slider-indicator li.active {
      width: 12px;
      height: 12px;
      opacity: 1;
    }
  </style>
</head>

<body>
  <div class="slider">
    <div class="slider-wrapper">
      <img src="./images/slider01.jpg" alt="" />
    </div>
    <div class="slider-footer">
      <p>对人类来说会不会太超前了？</p>
      <ul class="slider-indicator">
        <li class="active"></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
      </ul>
      <div class="toggle">
        <button class="prev">&lt;</button>
        <button class="next">&gt;</button>
      </div>
    </div>
  </div>
  <script>
    // 1. 初始数据
    const sliderData = [
      { url: './images/slider01.jpg', title: '对人类来说会不会太超前了？', color: 'rgb(100, 67, 68)' },
      { url: './images/slider02.jpg', title: '开启剑与雪的黑暗传说！', color: 'rgb(43, 35, 26)' },
      { url: './images/slider03.jpg', title: '真正的jo厨出现了！', color: 'rgb(36, 31, 33)' },
      { url: './images/slider04.jpg', title: '李玉刚：让世界通过B站看到东方大国文化', color: 'rgb(139, 98, 66)' },
      { url: './images/slider05.jpg', title: '快来分享你的寒假日常吧~', color: 'rgb(67, 90, 92)' },
      { url: './images/slider06.jpg', title: '哔哩哔哩小年YEAH', color: 'rgb(166, 131, 143)' },
      { url: './images/slider07.jpg', title: '一站式解决你的电脑配置问题！！！', color: 'rgb(53, 29, 25)' },
      { url: './images/slider08.jpg', title: '谁不想和小猫咪贴贴呢！', color: 'rgb(99, 72, 114)' },
    ]

    // 获取对应元素
    const img = document.querySelector('.slider-wrapper img')
    const p = document.querySelector('.slider-footer p')
    const footer = document.querySelector('.slider-footer')

    // 1.右按钮业务
    // 1.1 获取右按钮
    const next = document.querySelector('.next')
    // 1.3.1 初始索引
    let index = 0
    // 1.2 添加点击事件
    next.addEventListener('click', function () {
      // 1.3 渲染对应数据
      index++
      index %= sliderData.length
      // 调用渲染函数
      toggle()
    })

    // 1.左按钮业务
    // 1.1 获取左按钮
    const prev = document.querySelector('.prev')
    // 1.2 添加点击事件
    prev.addEventListener('click', function () {
      // 1.3 渲染对应数据
      index--
      if (index < 0) {
        index = sliderData.length - 1
      }
      // 调用渲染函数
      toggle()
    })

    // 声明一个渲染函数
    function toggle() {
      img.src = sliderData[index].url
      p.innerHTML = sliderData[index].title
      footer.style.backgroundColor = sliderData[index].color
      // 1.3.2 切换小圆点 先移除.active 再给当前的li添加.active
      document.querySelector('.slider-indicator .active').classList.remove('active')
      document.querySelector(`.slider-indicator li:nth-child(${index + 1})`).classList.add('active')
    }

    // 3. 自动播放
    let timerId = setInterval(function () {
      //  3.1 利用JS点击事件 click()方法模拟点击右按钮 记得一定要加()
      next.click()
    }, 1000)

    // 4. 鼠标经过大盒子，关闭定时器
    // 4.1 获取大盒子
    const slider = document.querySelector('.slider')
    // 4.2 添加鼠标经过事件
    slider.addEventListener('mouseenter', function () {
      // 4.3 关闭定时器
      clearInterval(timerId)
    })

    // 5. 鼠标离开大盒子，重新开启定时器 先关闭再开启
    slider.addEventListener('mouseleave', function () {
      // 5.1 清除定时器
      clearInterval(timerId)
      // 5.2 重新开启定时器
      timerId = setInterval(function () {
        next.click()
      }, 1000)
    })
  </script>
</body>

</html>
