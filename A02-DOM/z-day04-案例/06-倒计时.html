<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <style>
    .countdown {
      width: 240px;
      height: 305px;
      text-align: center;
      line-height: 1;
      color: #fff;
      background-color: brown;
      /* background-size: 240px; */
      /* float: left; */
      overflow: hidden;
    }

    .countdown .next {
      font-size: 16px;
      margin: 25px 0 14px;
    }

    .countdown .title {
      font-size: 33px;
    }

    .countdown .tips {
      margin-top: 80px;
      font-size: 23px;
    }

    .countdown small {
      font-size: 17px;
    }

    .countdown .clock {
      width: 142px;
      margin: 18px auto 0;
      overflow: hidden;
    }

    .countdown .clock span,
    .countdown .clock i {
      display: block;
      text-align: center;
      line-height: 34px;
      font-size: 23px;
      float: left;
    }

    .countdown .clock span {
      width: 34px;
      height: 34px;
      border-radius: 2px;
      background-color: #303430;
    }

    .countdown .clock i {
      width: 20px;
      font-style: normal;
    }
  </style>
</head>

<body>
  <div class="countdown">
    <p class="next">今天是2222年2月22日</p>
    <p class="title">下班倒计时</p>
    <p class="clock">
      <span id="hour">00</span>
      <i>:</i>
      <span id="minutes">25</span>
      <i>:</i>
      <span id="scond">20</span>
    </p>
    <p class="tips">18:30:00下课</p>
  </div>
  <script>
    function getCountTime() {
      // 当前的时间戳
      const now = +new Date()

      // 下班的时间戳
      const end = +new Date('2026-09-02 00:00:00')

      // 剩余时间的时间戳，转换为秒
      const time = (end - now) / 1000

      // 计算小时、分钟、秒 因为每秒都要更新，所以用let，个位数补'0'
      let h = Math.floor(time / 60 / 60 % 24)
      h = h < 10 ? '0' + h : h
      let m = Math.floor(time / 60 % 60)
      m = m < 10 ? '0' + m : m
      let s = Math.floor(time % 60)
      s = s < 10 ? '0' + s : s

      // 更新页面上的时间
      document.querySelector('#hour').innerHTML = h
      document.querySelector('#minutes').innerHTML = m
      document.querySelector('#scond').innerHTML = s
    }

    // 调用函数
    getCountTime()
    // 每秒调用一次函数
    setInterval(function () {
      getCountTime()
    }, 1000)

  </script>
</body>

</html>
