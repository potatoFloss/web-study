<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>学生信息管理</title>
  <link rel="stylesheet" href="css/index.css" />
</head>

<body>
  <h1>新增学员</h1>
  <form class="info" autocomplete="off">
    姓名：<input type="text" class="uname" name="uname" />
    年龄：<input type="text" class="age" name="age" />
    性别:
    <select name="gender" class="gender">
      <option value="男">男</option>
      <option value="女">女</option>
    </select>
    薪资：<input type="text" class="salary" name="salary" />
    就业城市：<select name="city" class="city">
      <option value="北京">北京</option>
      <option value="上海">上海</option>
      <option value="广州">广州</option>
      <option value="深圳">深圳</option>
      <option value="曹县">曹县</option>
    </select>
    <button class="add">录入</button>
  </form>

  <h1>就业榜</h1>
  <table>
    <thead>
      <tr>
        <th>学号</th>
        <th>姓名</th>
        <th>年龄</th>
        <th>性别</th>
        <th>薪资</th>
        <th>就业城市</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody>
      <!-- 
        <tr>
          <td>1001</td>
          <td>欧阳霸天</td>
          <td>19</td>
          <td>男</td>
          <td>15000</td>
          <td>上海</td>
          <td>
            <a href="javascript:">删除</a>
          </td>
        </tr> 
        -->
    </tbody>
  </table>
  <script>
    // 1. 录入模块
    // 1.1 创建一个空数组，用来存储录入的学员信息
    const arr = []
    // 1.2 获取元素，用来查找录入的学员信息
    const info = document.querySelector('.info')
    const uname = document.querySelector('.uname')
    const age = document.querySelector('.age')
    const gender = document.querySelector('.gender')
    const salary = document.querySelector('.salary')
    const city = document.querySelector('.city')
    // 获取所有有name属性的元素，用来表单验证
    const items = document.querySelectorAll('[name]')

    // 1.3 给表单注册提交事件
    info.addEventListener('submit', function (e) {
      // 1.4 阻止表单默认提交行为 ，否则会刷新页面
      e.preventDefault()

      // 表单验证 验证表单内容是否为空 为空则中断提交，不需要添加数据到数组中
      for (let i = 0; i < items.length; i++) {
        if (items[i].value === '') {
          // return的作用是中断函数的执行
          return alert(`输入内容不能为空`)
        }
      }

      // 1.5 创建一个对象，用来存储录入的学员信息
      const obj = {
        id: arr.length + 1,
        uname: uname.value,
        age: age.value,
        gender: gender.value,
        salary: salary.value,
        city: city.value,
      }
      // 1.6 把对象添加到数组里面
      arr.push(obj)
      // 1.7 清空表单至默认状态 reset()方法
      info.reset()
      // 1.8 渲染模块
      render()
    })


    // 2. 渲染模块 因为录入和删除都需要重新渲染，所以封装成函数
    // 2.1 获取tbody元素
    const tbody = document.querySelector('tbody')
    function render() {
      // 先清空tbody元素
      tbody.innerHTML = ''
      for (let i = 0; i < arr.length; i++) {
        const obj = arr[i]
        // 2.2 创建tr元素
        const tr = document.createElement('tr')
        // 2.3 修改tr元素的innerHTML属性
        tr.innerHTML = `
          <td>${obj.id}</td>
          <td>${obj.uname}</td>
          <td>${obj.age}</td>
          <td>${obj.gender}</td>
          <td>${obj.salary}</td>
          <td>${obj.city}</td>
          <td>
            <a href="javascript:" data-index="${i}">删除</a>
          </td>
        `
        // 2.4 将tr追加到tbody中
        tbody.appendChild(tr)
      }
    }


    // 3. 删除模块 通过事件委托实现
    tbody.addEventListener('click', function (e) {
      // 3.1 点击a标签，删除数组中的元素
      if (e.target.tagName === 'A') {
        // 3.2 获取被点击的a标签的data-index属性值
        const index = e.target.dataset.index
        // 3.3 通过index删除数组中对应的元素
        arr.splice(index, 1)
        // 3.4 渲染模块
        render()
      }
    })

  </script>

</body>

</html>
