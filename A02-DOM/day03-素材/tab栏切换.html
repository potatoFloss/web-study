<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tab栏切换</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    .tab {
      width: 590px;
      height: 340px;
      margin: 20px;
      border: 1px solid #e4e4e4;
    }

    .tab-nav {
      width: 100%;
      height: 60px;
      line-height: 60px;
      display: flex;
      justify-content: space-between;
    }

    .tab-nav h3 {
      font-size: 24px;
      font-weight: normal;
      margin-left: 20px;
    }

    .tab-nav ul {
      list-style: none;
      display: flex;
      justify-content: flex-end;
    }

    .tab-nav ul li {
      margin: 0 20px;
      font-size: 14px;
    }

    .tab-nav ul li a {
      text-decoration: none;
      border-bottom: 2px solid transparent;
      color: #333;
    }

    .tab-nav ul li a.active {
      border-color: #e1251b;
      color: #e1251b;
    }

    .tab-content {
      padding: 0 16px;
    }

    .tab-content .item {
      display: none;
    }

    .tab-content .item.active {
      display: block;
    }
  </style>
</head>

<body>
  <div class="tab">
    <div class="tab-nav">
      <h3>每日特价</h3>
      <ul>
        <li><a class="active" href="javascript:;" data-index="0">精选</a></li>
        <li><a href="javascript:;" data-index="1">美食</a></li>
        <li><a href="javascript:;" data-index="2">百货</a></li>
        <li><a href="javascript:;" data-index="3">个护</a></li>
        <li><a href="javascript:;" data-index="4">预告</a></li>
      </ul>
    </div>
    <div class="tab-content">
      <div class="item active"><img src="./images/tab00.png" alt="" /></div>
      <div class="item"><img src="./images/tab01.png" alt="" /></div>
      <div class="item"><img src="./images/tab02.png" alt="" /></div>
      <div class="item"><img src="./images/tab03.png" alt="" /></div>
      <div class="item"><img src="./images/tab04.png" alt="" /></div>
    </div>
  </div>

  <script>
    // 通过事件委托的方法实现tab栏切换
    // 1. 获取上级元素ul
    const ul = document.querySelector('.tab-nav ul')
    // 2. 给ul注册事件
    ul.addEventListener('mouseover', function (e) {
      // 查看点击的元素对象是谁
      // console.dir(e.target)
      // 查看点击的元素对象的标签名
      // console.log(e.target.tagName)

      // 2.1 当a标签被点击时，为该a标签添加active类名
      if (e.target.tagName === 'A') {
        // 2.1.1 先移除原来的active类名
        document.querySelector('.tab-nav .active').classList.remove('active')
        e.target.classList.add('active')

        // 2.2 通过自定义属性data-index获取当前点击的a标签的索引值
        const index = Number(e.target.dataset.index)
        // console.log(index)

        // 2.3 通过索引值切换tab-content中的item
        // 2.3.1 先移除之前的active类名
        document.querySelector('.tab-content .active').classList.remove('active')
        // 2.3.2 再给对应的item添加active类名
        // document.querySelectorAll('.tab-content .item')[index].classList.add('active')
        document.querySelector(`.tab-content .item:nth-child(${index + 1})`).classList.add('active')

      }
    })
  </script>
</body>

</html>
