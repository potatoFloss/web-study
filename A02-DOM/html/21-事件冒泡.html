<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>事件冒泡</title>
  <style>
    .parent {
      width: 200px;
      height: 200px;
      background-color: pink;
    }

    .child {
      width: 100px;
      height: 100px;
      background-color: skyblue;
    }
  </style>
</head>

<body>
  <div class="parent">
    <div class="child"></div>
  </div>

  <script>
    const parent = document.querySelector('.parent')
    const child = document.querySelector('.child')
    // 事件流：事件捕获、事件冒泡
    // 事件捕获：事件先从最外层的元素开始，依次向内层的元素传递，L2阶段事件监听第三个参数的值为true时触发
    /*
    document.addEventListener('click', function () {
      alert('点击了文档')
    }, true)
    parent.addEventListener('click', function () {
      alert('点击了parent元素')
    }, true)
    child.addEventListener('click', function () {
      alert('点击了child元素')
    }, true)
    */

    // 事件冒泡：事件先从最内层的元素开始，依次向外层的元素传递，L2阶段事件监听第三个参数的值为false时触发，默认值为false
    document.addEventListener('click', function () {
      alert('点击了文档')
    }, false)
    parent.addEventListener('click', function () {
      alert('点击了parent元素')
    })
    child.addEventListener('click', function (e) {
      alert('点击了child元素')
      // 阻止流动传播 既可以阻止事件冒泡，也可以阻止事件捕获
      // 事件对象.stopPropagation()
      e.stopPropagation()
    }, false)
  </script>
</body>

</html>
