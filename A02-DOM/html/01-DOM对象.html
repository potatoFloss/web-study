<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM对象</title>
</head>

<body>
  <!-- DOM树：将HTML文档以树状结构直观表现出来，DOM树直观地体现了标签与标签之间的关系。 -->

  <!-- DOM对象：浏览器根据HTML标签生成的JS对象。DOM的核心就是把内容当对象来处理 -->

  <!-- document：是DOM里提供的一个对象，document对象是DOM树的根节点，网页所有内容都在document里面。 -->

  <div></div>

  <script>
    // 1. 通过标签名获取对象
    // 建议变量都用const声明，如果后面发现变量的值会改变，再用let声明。
    const div = document.querySelector('div')
    // console.dir()方法可以查看对象的所有属性和方法。
    console.dir(div)
  </script>
</body>

</html>
