<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 实例化 new关键字

    // 得到操作系统当前时间的日期对象
    // 实际项目中，获取标准时间通常用服务器时间，发送请求给服务器，服务器返回标准时间
    const date = new Date()
    console.log(date)

    // 得到指定时间的日期对象  格式：yyyy-MM-dd hh:mm:ss
    const date1 = new Date('2027-12-01 12:00:00')
    console.log(date1)
  </script>
</body>

</html>
