<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>事件解绑</title>
</head>

<body>
  <button>点击</button>

  <script>
    const btn = document.querySelector('button')

    // 1. L0 事件解绑方式
    // 1.1 L0 添加点击事件
    // btn.onclick = function () {
    //   alert('点击了按钮')
    // }
    // 1.2 L0 解绑事件
    // btn.onclick = null

    // 2. L2 事件解绑方式 匿名函数无法解绑
    // 2.1 L2 添加点击事件
    function fn() {
      alert('点击了按钮')
    }
    btn.addEventListener('click', fn)
    // 2.2 L2 解绑事件
    // btn.removeEventListener('click', fn)

  </script>
</body>

</html>
