<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <ul>
    <li>111</li>
    <li>222</li>
    <li>333</li>
  </ul>

  <script>
    /*
    克隆节点：元素节点.cloneNode(是否深克隆)
    1. 是否深克隆：true 表示深克隆，false 表示浅克隆，不填写默认是浅克隆
    2. 浅克隆：只克隆元素节点，不克隆子节点
    3. 深克隆：克隆元素节点及其所有子节点
    */

    const ul = document.querySelector('ul')
    // 深克隆第一个li
    const liClone = ul.children[0].cloneNode(true)
    // 把克隆的li添加到ul中子节点的最后一个
    ul.appendChild(liClone)
  </script>
</body>

</html>
