<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <ul>
    <li>111</li>
  </ul>

  <script>
    const ul = document.querySelector('ul')

    // 1. 创造新节点 .createElement('标签名')
    const li1 = document.createElement('li')
    const li2 = document.createElement('li')
    // 2. 新增节点的2种方式：
    // 2.1. 对象.appendChild(插入的元素) 插入到对象的最后一个子元素后面
    li1.innerHTML = '我在最后'
    ul.appendChild(li1)

    // 2.2. 对象.insertBefore(插入的元素, 放到哪个元素前面) 插入到对象中指定元素前面
    li2.innerHTML = '我在第一个'
    ul.insertBefore(li2, ul.children[0])
  </script>
</body>

</html>
