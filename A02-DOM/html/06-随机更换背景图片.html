<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>随机更换背景图片</title>
  <style>
    body {
      background: url(../img/day1-images/desktop_1.jpg) no-repeat top center/cover;
    }
  </style>
</head>

<body>
  <script>
    // 1.获取body标签 因为整个页面只有一个body标签，所以可以直接使用
    const body = document.body

    // 2. 随机数函数 [min, max]
    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min
    }

    // 2.1 获取一个随机数
    const randomInt = getRandomInt(1, 10)

    // 3. 更换背景图片
    body.style.backgroundImage = `url(../img/day1-images/desktop_${randomInt}.jpg)`

  </script>
</body>

</html>
