<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>环境对象this</title>
</head>

<body>
  <button>点击</button>

  <script>
    // 每个函数中都有一个this对象（环境对象）
    /* 简单来说，谁调用函数，this就指向谁。
    例如下面的fn函数，它被调用的完整写法是：window.fn()，所以this指向window对象。
    而在浏览器中，全局对象是window对象。
    */
    function fn() {
      console.log(this)  // window对象
    }
    fn()

    const btn = document.querySelector('button')
    btn.addEventListener('click', function () {
      console.log(this)  // 按钮元素
      // 点击按钮是，文字变成红色
      // 以前的写法
      // btn.style.color = 'red'
      // this的写法
      this.style.color = 'red'
    })
  </script>
</body>

</html>
