<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>事件委托</title>
</head>

<body>
  <ul>
    <li>第1个li</li>
    <li>第2个li</li>
    <li>第3个li</li>
    <li>第4个li</li>
    <li>第5个li</li>
    <p>点我不变色</p>
  </ul>

  <script>
    /*
      事件委托的原理：通过事件流（事件冒泡）的特性
      1. 给上一级元素注册事件
      2. 当我们点击子元素时，会冒泡到上一级元素上，触发事件
      3. 通过 事件对象.target.tagName 来获得真正触发事件的元素
      4. 优点：减少注册次数，提高性能
    */
    // 通过事件委托的方法，实现点击li时，li会变色
    // 1. 获取上一级元素
    const ul = document.querySelector('ul')
    // 2. 给上一级元素添加点击事件
    ul.addEventListener('click', function (e) {
      // 2.1 获取被点击的子元素
      console.dir(e.target)
      // 2.2 获取被点击的子元素的名称
      console.log(e.target.tagName)

      // 3. 判断点击的元素是否是li
      if (e.target.tagName === 'LI') {
        // 4. 变色
        e.target.style.color = 'red'
      }
    })
  </script>
</body>

</html>
