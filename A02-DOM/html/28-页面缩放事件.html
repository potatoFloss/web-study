<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面缩放事件</title>
</head>

<body>
  <script>
    // 页面缩放事件：当页面缩放时，触发该事件
    window.addEventListener('resize', function () {
      console.log('页面缩放了')
    })
  </script>
</body>

</html>
