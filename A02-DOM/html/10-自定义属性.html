<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自定义属性</title>
</head>

<body>
  <!-- 自定义属性：data-开头的属性名 -->
  <div data-index="1" data-name="kk">1</div>
  <div data-index="2">2</div>
  <div data-index="3">3</div>
  <div data-index="4">4</div>
  <div data-index="5">5</div>
</body>

<script>
  const div1 = document.querySelector('div')
  // 1. 获取自定义属性的值 在JS中使用dataset属性
  // 1.1 dataset是自定义属性的集合
  console.log(div1.dataset)
  console.log(div1.dataset.index)
  console.log(div1.dataset.name)
</script>

</html>
