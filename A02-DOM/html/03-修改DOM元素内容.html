<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设置/修改DOM元素内容</title>
</head>

<body>
  <div class="box">我是box元素</div>

  <script>
    /*
    设置/修改DOM元素内容，共有2种方式：
    1. innerHTML属性，能够解析标签（也能解析文本内容），建议使用模板字符串``包裹
    2. innerText属性，不能解析标签，只能解析文本内容
    */

    const box = document.querySelector('.box')
    // box.innerHTML = `<strong>我是box元素</strong>`
    box.innerText = `<strong>我是box元素</strong>`
  </script>
</body>

</html>
