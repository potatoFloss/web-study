<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box {
      width: 200px;
      height: 200px;
      background-color: pink;
    }
  </style>
</head>

<body>
  <div class="box"></div>

  <script>
    const box = document.querySelector('.box')

    // 鼠标经过事件
    box.addEventListener('mouseenter', function () {
      console.log('鼠标经过')
    })

    // 鼠标离开事件
    box.addEventListener('mouseleave', function () {
      console.log('鼠标离开')
    })

    // 焦点事件（表单） focus获得焦点 blur失去焦点

    // 键盘事件 keydown按下 keyup松开

    // 文本事件（表单） input输入
  </script>
</body>

</html>
