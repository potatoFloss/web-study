<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>回调函数</title>
</head>

<body>
  <script>
    // 回调函数：一个函数作为参数传递给另一个函数，这个函数被称为回调函数
    /* 例如：使用匿名函数作为回调函数比较常见
    1. 定时器函数 setInterval(回调函数, 时间间隔)
    2. 事件函数 addEventListener('事件名', 回调函数)
    */
  </script>
</body>

</html>
