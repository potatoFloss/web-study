<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      height: 2000px;
    }

    div {
      width: 100px;
      height: 100px;
      margin: 100px;
      background-color: pink;
    }
  </style>
</head>

<body>
  <div></div>

  <script>
    const div = document.querySelector('div')

    // getBoundingClientRect() 返回元素大小及其相对于 视口 的位置
    console.log(div.getBoundingClientRect())
  </script>
</body>

</html>
