<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 1.页面输出1-100的偶数
    let i = 1; // 初始化变量
    while (i <= 100) {
      document.write(i + ' ')
      i++
    }

    // 计算从1加到100的总和并输出结果
    let sum = 0
    let num = 1
    while (num <= 100) {
      sum += num
      num++
    }
    document.write(`<hr> 1-100的总和为: ${sum}`)

    // 计算1-100之间所有偶数的和
    let ans = 0
    let j = 1
    while (j <= 100) {
      ans += j % 2 === 0 ? j : 0
      // if (j % 2 === 0) {
      //   ans += j
      // }
      j++
    }
    document.write(`<hr> 1-100之间所有偶数的和为: ${ans}`)
  </script>
</body>

</html>
