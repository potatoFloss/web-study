<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>字符串类型-string</title>
</head>

<body>
  <script>
    /*
    初始化字符串时，需要用双引号、单引号、反引号括起来（一般推荐用单引号，可以和css中的class的双引号区分开），
    如果中间包含双引号或单引号，需要使用转义字符\来转义，转义字符后面跟着的字符会被解释为普通字符，或者根据外单内双、外双内单。
    如果引号中间什么都没有，即为空字符串。
    */
    let str = "hello \"world\""
    let str1 = 'hello world'
    let str2 = `hello world`
    let str3 = ''

    // 字符串的拼接 +
    let str4 = str + str1 + str2 + str3
    console.log(str4)
    // 只要其中一个是字符串，用+，就是字符串的拼接
    let age = 18
    console.log('我今年' + age + '岁')
  </script>
</body>

</html>
