<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>九九乘法表</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    table {
      border-collapse: collapse;
    }

    td {
      border: 1px solid black;
      padding: 2px 5px;
      text-align: center;
      height: 30px;
      line-height: 30px;
    }
  </style>
</head>

<body>

  <script>
    document.write('<table>');
    for (let i = 1; i <= 9; i++) {
      document.write('<tr>');
      for (let j = 1; j <= i; j++) {
        document.write(`<td>${j} x ${i} = ${j * i}</td>`);
      }
      document.write('</tr>');
    }
    document.write('</table>');
  </script>
</body>

</html>
