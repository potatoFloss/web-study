<body>
  <table>
    <tr>
      <th>姓名</th>
      <th>年龄</th>
      <th>性别</th>
    </tr>
    <tr>
      <td>xxx</td>
      <td>xxxx</td>
      <td>xxxx</td>
    </tr>
  </table>
  <script>
    // 需求：请把下面数据中的对象打印出来

    // 定义一个存储了若干学生信息的数组
    let students = [
      {
        username: '张三',
        age: 18,
        sex: '男'
      },
      {
        username: '李四',
        age: 19,
        sex: '男'
      },
      {
        username: '王五',
        age: 20,
        sex: '男'
      }
    ]

    for (let i = 0; i < students.length; i++) {
      for (let key in students[i]) {
        console.log(`${key}: ${students[i][key]}`)
      }
      console.log('-----------------')
    }
  </script>
