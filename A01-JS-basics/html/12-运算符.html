<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>运算符</title>
</head>

<body>
  <script>
    /*
    运算符：赋值运算符、一元运算符、比较运算符、逻辑运算符
    */

    // 赋值运算符：= += -= *= /= %=
    let a = 10
    a += 10
    console.log(a)  // 20

    // 一元运算符：正负号 ++ --
    /* 其中，自增、自减运算符还有前置、后置两种形式，其区别是，
    前置先自增（减），再返回新值，后置先返回当前值，再自增（减） */
    let b = 10
    // ++b b先进行自增变成11，然后再+1，得到结果12
    console.log(++b + 1)  // 12

    let c = 10
    // c++ 此时c为10,先+1，得到结果11，语句执行往完之后，c再自增变成11
    console.log(c++ + 1)  // 11
    console.log(c)  // 11

    let i = 1
    // console.log(i++ + ++i + i)
    console.log(i++ + i++ + i)  // 6

    // 比较运算符：> < >= <= == != === !==
    // 比较运算符也有隐式转换
    /*
    == 左右两边的值是否相等
    === 全等，左右两边的值和类型是否都相等
    再开发当中，推荐使用===，因为==会有很多隐藏问题
    字符串比较，用ASCII码值比较，从左往右依次比较
    涉及到NaN，都是false
    尽量不要比较小数，因为小数比较会涉及到精度问题
    */

    // 逻辑运算符：&& || !
    /*
    && 与运算，左右两边的值都为true，结果才为true
    || 或运算，左右两边的值有一个为true，结果就为true
    ! 非运算，对一个值取取反，true变false，false变true
    */

    // 运算符的优先级（从高到低）：
    // 1. 小括号 ()
    // 2. 一元运算符 ++ -- !
    // 3. 算数运算符 先* / % 再+ -
    // 4. 关系运算符 > < >= <=
    // 5. 相等运算符 == != === !==
    // 6. 逻辑运算符 先&& 后||
    // 7. 赋值运算符 =
    // 8. 逗号运算符 ,
  </script>
</body>

</html>
