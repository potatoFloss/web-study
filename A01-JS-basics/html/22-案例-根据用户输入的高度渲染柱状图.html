<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>渲染柱状图</title>
  <link rel="stylesheet" href="../css/22-渲染柱状图.css">
</head>

<body>
  <!-- <div class="box">
    <div class="item-1">
      <p class="height">123</p>
      <p class="month">第一季度</p>
    </div>
    <div class="item-2"></div>
    <div class="item-3"></div>
    <div class="item-4"></div>
  </div> -->

  <script>
    document.write(`<div class="box">`)
    for (let i = 1; i <= 4; i++) {
      let h = +prompt(`请输入第${i}季度的高度`)
      document.write(`<div class="item-${i}" style="height: ${h}px;">
        <p class="height">${h}</p>
        <p class="month">第${i}季度</p>
      </div>`)
    }
    document.write(`</div>`)
  </script>
</body>

</html>
