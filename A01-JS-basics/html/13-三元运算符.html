<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 三元运算符
    // 语法：条件 ? 表达式1 : 表达式2
    // 说明：如果条件为true，执行表达式1；否则执行表达式2
    // 在实际开发中，一般用来取值
    let a = 10;
    let b = 20;
    let c = a > b ? a : b;
    console.log(c); // 20
  </script>
</body>

</html>
