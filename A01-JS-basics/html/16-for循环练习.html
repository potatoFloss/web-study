<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="../iconfont/iconfont.css">
</head>

<body>
  <script>
    // 利用for循环输出1-100岁
    for (let i = 1; i <= 100; i++) {
      document.write(`${i}岁 `)
    }
    document.write('<hr>')

    // 求1-100之间所有偶数的和
    let sum = 0
    for (let i = 1; i <= 100; i++) {
      sum += i % 2 === 0 ? i : 0
    }
    document.write(`1-100之间所有偶数的和为: ${sum}
    <hr>`)

    // 在页面中打印5个小星星
    for (let i = 0; i < 5; i++) {
      document.write(`<i class="iconfont icon-xingxing"></i>`)
    }
  </script>
</body>

</html>
