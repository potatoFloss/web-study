<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 变量的使用

    // 1. 变量的定义
    let name
    // 2. 变量的赋值
    name = '李四'
    // 3. 变量的使用
    console.log(name)

    // 4. 变量声明的同时赋值，也叫做变量的初始化
    let age = 18
    // 5. 更新变量
    age = 19
    console.log(age)

    // 6. 一次性初始化多个变量（不推荐）
    let home = '德阳', car = '比亚迪'
    console.log(home, car)
  </script>
</body>

</html>
