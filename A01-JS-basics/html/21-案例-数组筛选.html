<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数组筛选</title>
</head>

<body>
  <script>
    // 需求：将数组[2, 0, 6, 1, 77, 52, 0, 25, 7]中大于10的元素筛选出来
    let arr = [2, 0, 6, 1, 77, 52, 0, 25, 7]
    let newArr = []
    for (let i = 0; i < arr.length; i++) {
      if (arr[i] > 10) {
        newArr.push(arr[i])
      }
    }
    console.log(newArr);

    // 需求：将数组[2, 0, 6, 1, 77, 52, 0, 25, 7]中等于0的元素删除
    for (let i = 0; i < arr.length; i++) {
      if (arr[i] == 0) {
        arr.splice(i, 1)
        i--
      }
    }
    console.log(arr);
  </script>
</body>

</html>
