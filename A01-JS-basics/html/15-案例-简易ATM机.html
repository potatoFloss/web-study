<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 定义用户余额为0
    let balance = 1000

    // 标记循环是否继续
    let flag = true
    while (flag) {
      // 弹出提示框并接收用户选择
      let choice = prompt(`欢迎使用简易ATM机，请选择您的操作:\n
      1.查询余额\n
      2.存款\n
      3.取款\n
      4.退出\n`)

      // 处理用户选择
      switch (choice) {
        case '1':
          // 查询余额
          alert(`您的余额为: ${balance}`)
          break;
        case '2':
          // 存款
          let deposit = +prompt(`请输入存款金额:`)
          balance += deposit
          alert(`存款成功,您的余额为: ${balance}`)
          break;
        case '3':
          // 取款
          let withdraw = +prompt(`您的账户余额为: ${balance}\n请输入取款金额:`)
          if (balance >= withdraw) {
            balance -= withdraw
            alert(`取款成功,您的余额为: ${balance}`)
            break;
          } else {
            alert(`余额不足,取款失败`)
          }
          break;
        case '4':
          // 退出
          alert(`谢谢使用,再见!`)
          flag = false
          break;
        default:
          alert(`您输入的选择有误,请重新输入`)
          break;
      }
    }
  </script>
</body>

</html>
