<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 函数的断点调试
    // 控制台-Sources-将断点定在某行-查看下一步执行的语句（F11，一个箭头向下指向一个小圆点）
    // （F10，虽然也是下一步，但是它不进入函数内部）
    function addHello(a, b) {
      return a + b
    }
    // 函数的调用
    let result = addHello(1, 2);
    console.log(result);  //  3
  </script>
</body>

</html>
