<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>js的书写位置</title>
</head>

<body>


  <!-- 一共三种方式可以书写js代码 -->

  <!-- 1. 行内式 一般在vue中会用到 -->
  <!-- alert('hello') 是弹出提示框，提示框中显示hello -->
  <button onclick="alert('我是行内式js代码')">点击我</button>

  <!-- 2. 内部式 一般在html文件中写js代码，具体位置是在/body标签前面 -->
  <!-- <script>
    alert('我是内部式js代码')
  </script> -->

  <!-- 3. 外部式 -->
  <!-- <script src="../js/01-my.js">
    // 在外部式的这个位置不能写js代码，写了也会被忽略
  </script> -->
</body>

</html>
