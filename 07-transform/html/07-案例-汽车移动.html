<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>汽车移动案例</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .box {
      position: relative;
      width: 1000px;
      height: 400px;
      border: 1px solid red;
      margin: 0 auto;
    }

    .box .car {
      position: absolute;
      width: 400px;
      /* 用transform将car移动到box右侧垂直居中 */
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      transition: all 3s cubic-bezier(0.65, 0.05, 0.36, 1);
    }

    .car .body {
      width: 100%;
    }

    .car .left-wheel,
    .car .right-wheel {
      position: absolute;
      top: 75px;
      right: 76px;
      width: 53px;
      transition: all 3s cubic-bezier(0.65, 0.05, 0.36, 1);
    }

    .car .left-wheel {
      top: 75px;
      right: 289px;
    }

    /* 当鼠标移动到box上时，汽车向左移动600px */
    .box:hover .car {
      transform: translate(-600px, -50%);
    }

    /* 当鼠标移动到box上时，汽车左轮和右轮旋转360度 */
    .box:hover .left-wheel,
    .box:hover .right-wheel {
      transform: rotate(-360deg);
    }
  </style>
</head>

<body>
  <div class="box">
    <div class="car">
      <!-- 汽车主体 -->
      <img src="../img/car.webp" alt="" class="body">
      <!-- 汽车左轮 -->
      <img src="../img/wj.webp" alt="" class="left-wheel">
      <!-- 汽车右轮 -->
      <img src="../img/wj.webp" alt="" class="right-wheel">
    </div>
  </div>
</body>

</html>
