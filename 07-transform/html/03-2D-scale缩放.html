<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D-scale缩放</title>

  <style>
    [class^="box"] {
      width: 200px;
      height: 200px;
    }

    .box1 {
      background-color: pink;
      transition: all .3s;
    }

    /* 缩放：scale(缩放比例)，不会影响原来的文档流布局。
      缩放比例：1表示不缩放，0.5表示缩小到50%，1.5表示放大到150%
      scale() 里面一个值表示水平方向和垂直方向的缩放比例相同，
      scale(x轴的缩放比例，y轴的缩放比例) 
    */
    .box1:hover {
      transform: scale(1.5);
    }

    .box2 {
      background-color: skyblue;
    }
  </style>
</head>

<body>
  <div class="box1"></div>
  <div class="box2"></div>
</body>

</html>
