<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D-translate3d位移</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .box {
      position: relative;
      width: 300px;
      height: 450px;
      border: 1px solid blue;
      margin: 100px auto;
      /* 透视效果 */
      perspective: 1000px;
    }

    .box>div {
      position: absolute;
      width: 100%;
      height: 100%;
      background-color: pink;
      text-align: center;
      line-height: 450px;
      font-size: 30px;
      color: white;
      transition: all 1s;
      /* 反转后，背面会显示出来，需要隐藏背面 */
      backface-visibility: hidden;
      /* 给容器开启3D空间，才能使子元素沿着z轴移动有效 */
      transform-style: preserve-3d;
    }

    /* .box .front {
      z-index: 1;
    } */

    /* 使h3沿着z轴正方向移动50px */
    .box .front h3 {
      transform: translateZ(60px);
      backface-visibility: hidden;
    }

    .box:hover .front {
      transform: rotateY(-180deg);
    }

    .box .back {
      padding-top: 100px;
      background-color: skyblue;
      /* 初始化：沿着y轴正方向旋转180度 */
      transform: rotateY(180deg);
    }

    .box:hover .back {
      transform: rotateY(0deg);
    }

    .box .back p {
      line-height: 40px;
      font-size: 20px;
      transform: translate3d(0, 0, 60px);
      backface-visibility: hidden;
    }
  </style>
</head>

<body>
  <div class="box">
    <div class="front">
      <h3>刘德华</h3>
    </div>
    <div class="back">
      <p>1969年10月10日</p>
      <p>出生于中国北京</p>
      <p>四大天王之一</p>
    </div>
  </div>
</body>

</html>
