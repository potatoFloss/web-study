<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D变化-位移translate</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    [class^="box"] {
      width: 200px;
      height: 200px;
    }

    .box1 {
      background-color: pink;
      /* 位移：translate(水平方向的偏移量，垂直方向的偏移量) */
      /* transform: translate(100px, 100px); */
      /* transform: translateX(100px); */
      /* transform: translateY(100px); */

      /* 过渡：transition: all 过渡时间; */
      transition: all .3s;
    }

    .box1:hover {
      transform: translate(100px, 100px);
    }

    .box2 {
      background-color: skyblue;
      /* translate的值不仅可以是像素值，还可以是百分比值，相对于自身的宽度或高度 */
      /* transform: translate(50%, 50%); */
      /* transform对行内元素无效 */
      transform: translateX(50%);
      /* 使用场景：
      结合top: 50%; left: 50%; 与transform: translate(-50%, -50%); 实现元素居中*/
    }
  </style>
</head>

<body>

</body>
<div class="box1"></div>
<div class="box2"></div>

</html>
