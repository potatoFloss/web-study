<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>transition的完整写法</title>
  <style>
    /* transition的完整写法：（持续时间必写）
    transition: 过渡属性 持续时间 速度曲线 延迟时间;
    例如：
    transition: all .3s linear 1s;
    速度曲线有：
    ease 默认值，慢速开始->加速->慢速结束
    linear 匀速运动
    ease-in 慢速开始，逐渐加速
    ease-out 快速开始，逐渐减速
    ease-in-out 慢速开始和结束，中间加速
    cubic-bezier(x1, y1, x2, y2) 贝塞尔曲线，自定义速度曲线
    */
  </style>
</head>
