<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <h2>表格标签</h2>
  <!-- border一般通过CSS来设置，而不是通过HTML属性来设置。在此处仅用于演示。 -->
  <table border="1">
    <tr>
      <!-- th标签是表格的表头单元格，可以使其中的内容居中显示 -->
      <th>姓名</th>
      <th>年龄</th>
      <th>性别</th>
    </tr>
    <tr>
      <td>张三</td>
      <td>18</td>
      <td>男</td>
    </tr>
    <tr>
      <td>李四</td>
      <td>19</td>
      <td>女</td>
    </tr>
    <tr>
      <td>王五</td>
      <td>20</td>
      <td>男</td>
    </tr>
  </table>

  <!-- 合并单元格 -->
  <h2>合并单元格</h2>
  <!-- 合并单元格的属性是rowspan和colspan，按照左上原则，删除其它单元格，复杂情况请ai处理 -->
  <!-- rowspan是合并行，colspan是合并列 -->
  <!-- 合并单元格的属性值是合并的行数或列数 -->
  <table border="1">
    <tr>
      <th>姓名</th>
      <th>年龄</th>
      <th>性别</th>
      <th>籍贯</th>
    </tr>
    <tr>
      <td>张三</td>
      <td>18</td>
      <td>男</td>
      <td>北京</td>
    </tr>
    <tr>
      <td>李四</td>
      <td>19</td>
      <td>女</td>
      <td rowspan="2">上海</td>
    </tr>
    <tr>
      <td>王五</td>
      <td>20</td>
      <td>男</td>
      <!-- <td>上海</td> -->
    </tr>
  </table>

  <!-- 单元格结构 -->
  <h2>单元格结构</h2>
  <table border="1">
    <!-- thead标签是表格的头部 -->
    <thead>
      <tr>
        <th>姓名</th>
        <th>年龄</th>
        <th>性别</th>
      </tr>
    </thead>
    <!-- tbody标签是表格的主体 -->
    <tbody>
      <tr>
        <td>张三</td>
        <td>18</td>
        <td>男</td>
      </tr>
      <tr>
        <td>李四</td>
        <td>19</td>
        <td>女</td>
      </tr>
      <tr>
        <td>王五</td>
        <td>20</td>
        <td>男</td>
      </tr>
    </tbody>

    <!-- tfoot标签是表格的页脚,一般不常见 -->
    <tfoot>
      <tr>
        <td colspan="3">共3人</td>
      </tr>
    </tfoot>
  </table>

</body>

</html>
