<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <!-- 图像标签：img -->
  <!-- 
    图像标签的属性（通常建议通过CSS来设置，而不是通过HTML属性来设置）：
      alt：图像的替代文本，当图像无法显示时，会显示该文本。
      title：图像的标题，鼠标悬停在图像上时显示该文本。
      width：图像的宽度，单位为像素。
      height：图像的高度，单位为像素。
      border：图像的边框宽度，单位为像素。
      align：图像的对齐方式，可选值为：left、right、center、bottom、top。
      hspace：图像的水平间距，单位为像素。
      space：图像的垂直间距，单位为像素。
  -->
  <h2>图像标签</h2>
  <img src="images/00.png" alt="灰太狼" title="灰太狼" width="300">

  <!-- 图片的不同格式：png、webp、gif、jpeg、avif等 -->
  <h2>图片的不同格式</h2>
  <img src="images/00.png" alt="灰太狼">
  <img src="images/02logo.webp" alt="王者荣耀logo">
  <img src="images/03.webp" alt="">
  <img src="images/04.gif" alt="">
</body>

</html>
