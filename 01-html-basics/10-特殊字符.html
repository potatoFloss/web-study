<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <!-- 特殊字符：&lt; &gt; &amp; &copy; &reg; &trade; &euro; &pound; &yen; &cent; -->
  <!-- 特殊字符也叫做实体字符，以&开头，以;结尾 -->
  <p>
    空格：&nbsp;
    小于号：&lt;
    大于号：&gt;
    与号：&amp;
    版权符号：&copy;
    注册商标符号：&reg;
    商标符号：&trade;
    欧元符号：&euro;
    英镑符号：&pound;
    日元符号：&yen;
    分符号：&cent;
  </p>
</body>

</html>
