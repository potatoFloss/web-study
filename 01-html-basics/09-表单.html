<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <!-- 表单容器：form标签 -->
  <form action="">
    <!-- 表单控件：input标签 等等-->
    <ul>
      <!-- 单行文本框：text标签 -->
      <li>
        <!-- 
        input的属性：
        placeholder 提示信息 
        name 元素的名字
        maxlength 允许的最大字符数
        accesskey 使元素获得焦点的快捷键，按alt+指定的键即可获得焦点
        autocomplete 是否根据用户的历史输入自动填写，no/off
        -->
        账户：<input type="text" name="username" placeholder="请输入账户" autocomplete="off" accesskey="s">
      </li>

      <!-- 密码框：password标签 -->
      <li>
        密码：<input type="password" name="password" placeholder="请输入密码" autocomplete="off" maxlength="6">
      </li>

      <!-- 单选框：radio标签 -->
      <li>
        <!-- 单选框中，name属性相同的元素，只能选择一个，所以可以做到一个分组的效果 -->
        性别：
        <input type="radio" name="gender" value="male">男
        <!-- checked属性默认选中 -->
        <input type="radio" name="gender" value="female" checked>女
      </li>

      <!-- 复选框：checkbox标签 -->
      <li>
        爱好：
        <input type="checkbox" name="hobby" value="sports">运动
        <input type="checkbox" name="hobby" value="music">音乐
        <input type="checkbox" name="hobby" value="reading">阅读
      </li>

      <!-- 文件上传：file标签 -->
      <li>
        <!-- multiple属性允许用户选择多个文件 -->
        头像：<input type="file" name="file" multiple accept=".jpg,.gif">
      </li>

      <!-- 文本域：textarea标签 -->
      <li>
        <!-- cols属性指定文本域的宽度，rows属性指定文本域的高度（单位：行），一般用CSS设置宽度和高度 -->
        留言：<textarea name="introduction" cols="30" rows="3" placeholder="请输入留言"></textarea>
      </li>

      <!-- 下拉选择框：select标签，由于该标签的样式不好修改，在实际开发中，一般用其它的标签实现下拉选择框的效果 -->
      <li>
        国家：
        <select name="country">
          <option value="us">美国</option>
          <!-- selected属性默认选中 -->
          <option value="cn" selected>中国</option>
          <option value="jp">日本</option>
        </select>
      </li>

      <!-- 提交按钮：button标签 -->
      <li>
        <!-- disabled属性禁用按钮，用户不能点击按钮 -->
        <button>注册</button>
      </li>
    </ul>

  </form>
</body>

</html>
