<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <h2>html5新增的网页结构标签</h2>
  <header>网页头部标签</header>
  <nav>导航栏标签</nav>
  <!-- 网页主体标签 -->
  <main>
    <!-- aside和article按理应该左右排列而不是上下排列，这个可以通过CSS实现布局 -->
    <aside>侧边栏标签</aside>
    <article>主要内容区域标签</article>
  </main>
  <footer>网页底部标签</footer>

  <!-- 考虑浏览器的兼容性，可以用无语义的div和span标签来代替 -->
  <h2>div和span标签</h2>
  <div>我是div标签</div>
  <div>我是div标签</div>
  <span>我是span标签</span>
  <span>我是span标签</span>
</body>

</html>
