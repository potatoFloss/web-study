<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <!-- 块级元素：h、p、div等 -->
  <!-- 
    每个块级元素独占一行；
    它可以包含其他元素（块级元素、内联元素）；
    p标签中不能内嵌其它块级元素，段落标签主要放与文字相关的，如内联元素。
  -->

  <!-- 内联元素：span、em、a等 -->
  <!-- 
    一行可以放多个内联元素，通常与文本一起使用；
    不能内嵌块级元素，但可以内嵌其它内联元素；
  -->
  <span>
    <em>这是一个斜体</em>
  </span>

  <!-- 可以通过CSS的display属性来改变它们的显示方式，即二者可以互换 -->
</body>

</html>
