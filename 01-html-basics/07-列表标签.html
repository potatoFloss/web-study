<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <h2>无序列表</h2>
  <!-- ul标签是容器，只能包含li标签 -->
  <ul>
    <!-- li标签里可以添加其它html标签 -->
    <li>列表项1</li>
    <li>列表项2</li>
    <li>列表项3</li>
  </ul>

  <h2>有序列表（不常用）</h2>
  <!-- ol标签是容器，只能包含li标签 -->
  <ol>
    <!-- li标签里可以添加其它html标签 -->
    <li>列表项1</li>
    <li>列表项2</li>
    <li>列表项3</li>
  </ol>

  <h2>描述列表，通常在页脚使用</h2>
  <!-- dl标签是容器，只能包含dt和dd标签 -->
  <dl>
    <dt>被描述项</dt>
    <!-- dd标签里可以添加其它html标签 -->
    <dd>描述内容1</dd>
    <dd>描述内容2</dd>
    <dd>描述内容3</dd>
  </dl>
</body>

</html>
