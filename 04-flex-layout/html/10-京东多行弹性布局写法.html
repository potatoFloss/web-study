<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>京东多行弹性布局写法</title>
  <style>
    /* flex布局在针对一行很方便，在针对多行时，grid网格布局更方便 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .box {
      width: 80%;
      border: 1px solid blue;
      margin: 20px auto;

      /* 弹性布局 */
      display: flex;
      flex-wrap: wrap;
    }

    .box .item {
      /* width: 80px; */
      height: 120px;
      background-color: pink;

      /* 每个盒子占一份空间 */
      flex: 1;
      /* 此时会发现不能换行，所以为小盒子设置最小和最大宽度 */
      /* 这两句话的作用是，一行放6个小盒子 */
      /* min-width: 16.6666667%;
      max-width: 16.6666667%; */

      /* 给小盒子之间添加间距 */
      margin: 0 8px 16px;
      /* 此时会发现一行不能放6个小盒子了，小盒子被挤下来了 */
      /* 所以需要改变min-width和max-width的值 */
      /* 函数calc()的作用是，计算出一个值，这个值可以是长度、角度、百分比等。 */
      min-width: calc(16.6666667% - 16px);
      max-width: calc(16.6666667% - 16px);
    }

    .footer {
      width: 80%;
      height: 120px;
      border: 1px solid blue;
      margin: 0 auto;
    }
  </style>
</head>

<body>
  <div class="box">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
    <div class="item">5</div>
    <div class="item">6</div>
    <div class="item">7</div>
    <div class="item">8</div>
    <div class="item">9</div>
    <div class="item">10</div>
    <div class="item">11</div>
    <div class="item">12</div>
    <div class="item">13</div>
    <div class="item">14</div>
    <div class="item">15</div>
  </div>

  <footer>
    <div class="footer"></div>
  </footer>
</body>

</html>
