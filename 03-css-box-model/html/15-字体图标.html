<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>字体图标</title>
  <link rel="stylesheet" href="../iconfont/iconfont.css">
  <style>
    .icon-shipinyinliao {
      font-size: 30px;
    }
  </style>
</head>

<body>
  <!-- 字体图标要么由设计师提供，要么去字体库下载 -->
  <!-- 常用的字体库链接： 
    1. font-awesome：图标最全，有免费版和付费版 https://fontawesome.com/
    2. bootstrap icons：bootstrap生态内图标，简单易用 https://icons.getbootstrap.com/
    3. icomoon：图标库，支持自定义图标 https://icomoon.io/
    4. iconfont（推荐）：阿里字体库，包含淘宝图标和阿里妈妈图标库（免费） https://www.iconfont.cn/
  -->
  <i class="iconfont icon-shipinyinliao"></i>
</body>

</html>
