    * {

    }

    ul,

      list-style: none;
    }

    a {
      text-decoration: none;
      color: #1f1f1f;

    .service {
      width: 256px;

      background-color: #f7f7f7;

      margin: 100px auto;

    .service-title {
      padding: 8px 0 0 16px;

      color: #1f1f1f;
    }

    .service-title img {
      width: 60px;
      height: 20px;
    }

    .service-bd li {
      height: 32px;
      line-height: 32px;
      margin: 0 8px;
      padding-left: 8px;
      border-radius: 4px;
      transition: all 0.5s;
    }

    .service-bd li i {
      margin-right: 4px;
    }

    .service-bd li:hover {
      background-color: #fff;
    }

    .service-bd li:first-child,
    .service-bd li:first-child a {
      color: #ff5000;
    }

    .service-bd li a {
      font-size: 14px;
    }

    .service-bd li a:hover {
      color: #ff5000;
    }
  </style>
</head>
