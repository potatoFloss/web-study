<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>盒子阴影</title>
  <style>
    /* 盒子阴影 */
    .box1 {
      width: 500px;
      height: 200px;
      background-color: pink;
      /* box-shadow: 水平偏移量 垂直偏移量 模糊半径 扩散半径 阴影颜色 */
      /* 默认外阴影，内阴影需要加inset */
      /* box-shadow: 0 2px 6px inset rgba(30, 111, 217, 0.4); */

      /* 过渡效果 */
      /* transition: 过渡属性 过渡时间 过渡曲线 */
      /* 过渡写在盒子上，谁要过渡，写在谁那儿 */
      transition: all 0.3s ease-in-out;
    }

    .box1:hover {
      box-shadow: 0 2px 6px rgba(30, 111, 217, 0.4);
    }
  </style>
</head>

<body>
  <div class="box1"></div>
</body>

</html>
