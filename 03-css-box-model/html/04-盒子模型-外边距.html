<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>外边距</title>
  <style>
    [class^="box"] {
      width: 200px;
      height: 200px;
      background-color: pink;
    }

    .box1 {
      /* 和内边距的设置方式差不多 */
      /* 一个值 */
      /* margin: 10px; */
      /* 多个值，从上边的外边距开始，顺时针设置，没有设置的值和对侧的外边距值相同 */
      margin: 10px 20px 30px 40px;
    }

    .box2 {
      background-color: skyblue;
      /* 单独设置某条外边距 */
      /* 
      上外边距 margin-top
      右外边距 margin-right
      下外边距 margin-bottom
      左外边距 margin-left
      */
      margin-top: 10px;
    }

    /* 行内元素的上下外边距无效，左右外边距有效 */
    /* 行内元素的内边距和边框均有效 */
    /* 行内元素的宽高无效 */
    span {
      background-color: pink;
      margin-left: 10px;
    }
  </style>
</head>

<body>
  <div class="box1">盒子1</div>
  <div class="box2">盒子2</div>
  <span>行内元素1</span>
  <span>行内元素2</span>
</body>

</html>
