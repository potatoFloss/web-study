<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .father {
      position: relative;
      width: 500px;
      height: 500px;
      background-color: skyblue;
      margin: 100px auto auto 100px;
    }

    [class^="son"] {
      width: 200px;
      height: 200px;
      background-color: pink;
    }

    /* 绝对定位：相对于最近的已定位祖先元素进行定位，没有已定位祖先元素时，相对于视口进行定位。 
    常见情况下，祖先元素一般选择相对定位。
    绝对定位脱离文档流。
    top的优先级高于bottom，left的优先级高于right。
    */
    /* 常见的使用场景：弹出菜单/下拉框，悬浮效果 */
    .son1 {
      position: absolute;
      top: 100px;
      left: 100px;
    }

    .son2 {
      background-color: brown;
    }
  </style>
</head>

<body>
  <div class="father">
    <div class="son1"></div>
    <div class="son2"></div>
  </div>
</body>

</html>
